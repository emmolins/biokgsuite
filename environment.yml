name: biokgsuite
channels:
  - conda-forge
  - defaults
dependencies:
  # The results in the tree were produced on Python 3.12.11 (hpc/) with
  # networkx 3.6.1; the notebooks run unchanged on 3.11.
  - python=3.11
  - pip

  # ── Core data science ─────────────────────────────────────────────────────
  - pandas>=2.1,<3
  - numpy>=1.26,<3
  - scipy>=1.12,<2

  # ── Machine learning ──────────────────────────────────────────────────────
  - scikit-learn>=1.4,<2

  # ── Graph analysis ────────────────────────────────────────────────────────
  - networkx>=3.2,<4

  # ── Visualisation ─────────────────────────────────────────────────────────
  - matplotlib>=3.8,<4

  # ── Notebook environment ──────────────────────────────────────────────────
  - jupyter>=1.1
  - jupyterlab>=4.0
  - ipykernel>=6.29
  - tqdm>=4.66

  # ── Configuration ─────────────────────────────────────────────────────────
  - pyyaml>=6.0

  # ── Hosted-model clients (grounding_experiment/02_run) ────────────────────
  - requests>=2.31

  # ── Styled tables ─────────────────────────────────────────────────────────
  # pandas renders `DataFrame.style` through jinja2 and needs 3.1.2 or newer for
  # it. Notebook 00 displays the benchmark summary that way, so an older jinja2
  # fails there with "the '.style' accessor requires jinja2" even though the
  # import itself succeeds.
  - jinja2>=3.1.2

  # ── Parquet ───────────────────────────────────────────────────────────────
  # pandas needs an engine to read parquet. io/resolve.py reads the Open Targets
  # tables and io/loading.py reads the KG cache, so without this a fresh
  # environment fails on the first parquet read in notebooks 01, 03 and 04.
  - pyarrow>=15

  # ── Tests ─────────────────────────────────────────────────────────────────
  - pytest>=8.0             # tests/ — metric unit tests, `python -m pytest tests`

  # ── Embedding supplementary (supplementary/embeddings, biokgsuite.models) ──
  # Only the embedding arms import torch; the seven dimension notebooks do not,
  # and biokgsuite.models.embedding is the only module that imports it.
  - pytorch>=2.2
  - sentence-transformers>=3.0
  - transformers>=4.40

  # ── pip-only packages ─────────────────────────────────────────────────────
  - pip:
    - nbconvert>=7.14        # notebook export / CI execution
    # tools/fetch_kgs.py pulls the MATRIX KG from Hugging Face, pinned by
    # commit. Only that one fetch needs it; nothing in src/ imports it.
    - huggingface_hub>=0.23
    - ijson>=3.2             # tools/convert_hetionet_json.py
