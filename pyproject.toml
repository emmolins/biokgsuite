[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biokgsuite"
version = "1.0.3"
description = "A multidimensional evaluation framework for biomedical knowledge graphs"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["biokgsuite*"]

[tool.pytest.ini_options]
# src/ is put on the path so `python -m pytest tests` runs from a clean clone
# with no install step; `pip install -e .` also works.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
